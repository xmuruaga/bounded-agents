<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APC Interactive Demo — Bounded Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa;--white:#fff;--g50:#f8fafc;--g100:#f1f5f9;
  --g200:#e2e8f0;--g300:#cbd5e1;--g400:#94a3b8;
  --g500:#64748b;--g600:#475569;--g700:#334155;--g800:#1e293b;--g900:#0f172a;
  --accent:#1a1a2e;--accent-hover:#0f0f1e;
  --bl:#5a6f99;--bl50:#f5f6f9;--bl100:#e8ebf2;--bl700:#334155;
  --gn:#16825d;--gn50:#f0faf6;--gn100:#d8f0e5;
  --rd:#c0504d;--rd50:#fdf4f4;--rd100:#f5e0e0;
  --am:#a07d3a;--am50:#faf8f2;--am100:#f0eadb;
  --vi:#7c6bb5;--vi50:#f7f5fb;--vi100:#ece8f5;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',-apple-system,system-ui,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#fafaf9;color:var(--g900);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
@media(max-width:800px){body{overflow:auto}}

/* Top bar */
.top{height:52px;flex-shrink:0;background:var(--white);border-bottom:1px solid var(--g100);display:flex;align-items:center;padding:0 40px;z-index:10}
.top .brand{display:flex;align-items:center;gap:8px}
.top .bname{font:600 15px var(--sans);color:var(--g900);letter-spacing:-.2px}
.top-nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.top-nav-item{font:500 13px var(--sans);color:var(--g400);text-decoration:none;padding:6px 14px;border-radius:6px;transition:color .15s,background .15s}
.top-nav-item:hover{color:var(--g700);background:var(--g50)}
.top-nav-item.active{color:var(--g900);background:var(--g100)}
.btn{padding:8px 20px;border-radius:7px;border:1px solid var(--g200);background:var(--white);color:var(--g700);font:500 13px var(--sans);cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn:hover{border-color:var(--g300);background:var(--g50)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn.primary:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.25;cursor:default;pointer-events:none}
.pills{display:flex;gap:3px;align-items:center}
.pill{width:22px;height:5px;border-radius:3px;background:var(--g200);transition:.3s}
.pill.done{background:var(--g700)}.pill.now{background:var(--g900);box-shadow:0 0 6px rgba(0,0,0,.15)}
.kbd{font:11px var(--mono);color:var(--g400)}

/* Sandbox actions in narrator */
.sandbox-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.act-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--g200);background:var(--white);font:500 11px var(--mono);color:var(--g700);cursor:pointer;transition:.15s}
.act-btn:hover{border-color:var(--g400);color:var(--g900);background:var(--g50)}

/* Scenario selector */
.scbar{flex-shrink:0;border-bottom:1px solid var(--g200);background:var(--white);padding:8px 24px;display:flex;align-items:center;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.scbar::-webkit-scrollbar{display:none}
.scbar-label{font:600 11px var(--mono);color:var(--g400);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;margin-right:4px}
.scbtn{padding:7px 14px;border-radius:7px;border:1px solid var(--g200);background:var(--white);color:var(--g600);font:500 12px var(--sans);cursor:pointer;transition:.15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.scbtn .sc-num{font:700 10px var(--mono);width:18px;height:18px;border-radius:4px;background:var(--g100);color:var(--g500);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scbtn:hover{border-color:var(--g400);color:var(--g800)}
.scbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.scbtn.on .sc-num{background:rgba(255,255,255,.2);color:#fff}
.scbtn.sandbox{border-color:var(--vi100);color:var(--vi);background:var(--vi50)}
.scbtn.sandbox .sc-num{background:var(--vi100);color:var(--vi)}
.scbtn.sandbox.on{background:var(--accent);border-color:var(--accent);color:#fff}
.scbtn.sandbox.on .sc-num{background:rgba(255,255,255,.2);color:#fff}
@media(max-width:800px){.scbar{padding:6px 12px;gap:4px}.scbtn{padding:6px 10px;font-size:11px}.scbtn .sc-num{width:16px;height:16px;font-size:9px}}

/* Narrator + controls */
.narrator{flex-shrink:0;border-bottom:1px solid var(--g200);background:var(--white);padding:12px 28px;min-height:50px;display:flex;align-items:flex-start;gap:16px}
.narrator .ntxt{flex:1;font:400 14px/1.6 var(--serif);color:var(--g700)}
.narrator .ntxt em{font-style:normal;color:var(--rd);font-weight:600}
.narrator .ntxt strong{color:var(--gn);font-weight:600}
.nav-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.nav-controls .pills{display:flex;gap:3px;align-items:center}
.nav-controls .kbd{font:11px var(--mono);color:var(--g400)}
.nav-controls .step-count{font:500 11px var(--mono);color:var(--g400);white-space:nowrap}
@media(max-width:800px){
  .narrator{flex-direction:column;padding:10px 16px;gap:8px}
  .narrator .ntxt{font-size:13px}
  .nav-controls{align-self:flex-end}
  .top{padding:0 16px}
  .scbar{padding:8px 16px;gap:6px}
  .scbtn{padding:6px 12px;font-size:12px}
  .bub{max-width:280px;font-size:12px}
  .nav-controls .kbd{display:none}
}

/* Main 3-col */
.main{flex:1;display:grid;grid-template-columns:1fr 1fr 440px;overflow:hidden}
@media(max-width:1400px){.main{grid-template-columns:1fr 1fr 400px}}
@media(max-width:1200px){.main{grid-template-columns:1fr 1fr 360px}}
@media(max-width:1060px){
  .main{grid-template-columns:1fr 340px}
  .column.col-noarc{display:none}
}
@media(max-width:800px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr 1fr;overflow-y:auto}
  .column{border-right:none;border-bottom:1px solid var(--g200);min-height:40vh}
  .column.col-noarc{display:none}
}
.column{display:flex;flex-direction:column;border-right:1px solid var(--g200);overflow:hidden}
.column:last-child{border-right:none}
.col-hdr{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--g200);background:var(--white)}
.col-hdr .dot{width:8px;height:8px;border-radius:50%}
.col-hdr .dot.r{background:var(--rd)}.col-hdr .dot.g{background:var(--gn)}.col-hdr .dot.b{background:var(--g700)}
.col-hdr .ct{font:600 13px var(--sans);color:var(--g800)}
.col-hdr .cs{font:400 11px var(--sans);color:var(--g400);margin-left:auto;display:flex;align-items:center;gap:6px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--gn);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(5,150,105,.4)}50%{opacity:.7;box-shadow:0 0 0 4px rgba(5,150,105,0)}}

/* Chat */
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--g50)}
.msg{display:flex;gap:8px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.msg.show{opacity:1;transform:translateY(0)}
.avi{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font:600 11px var(--sans);flex-shrink:0}
.avi.human{background:var(--gn100);color:var(--gn)}.avi.agent{background:var(--vi100);color:var(--vi)}.avi.infra{background:var(--am100);color:var(--am)}
.bub{max-width:400px;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.bub.human-b{background:var(--white);border:1px solid var(--g200)}
.bub.agent-b{background:var(--white);border:1px solid var(--g200)}
.bub.tool-b{font-family:var(--mono);font-size:11px;background:var(--white);border:1px solid var(--g200);color:var(--g600);white-space:pre-wrap}
.bub.tool-b.ok{background:var(--gn50);border-color:var(--gn100);color:var(--gn)}
.bub.tool-b.fail{background:var(--rd50);border-color:var(--rd100);color:var(--rd)}
.bub.inject-b{background:var(--rd50);border:1px solid var(--rd100)}
.bub.infra-b{background:var(--am50);border:1px solid var(--am100)}
.bub.result-ok{background:var(--gn50);border:1px solid var(--gn100)}
.bub.result-bad{background:var(--rd50);border:1px solid var(--rd100)}
.tag{display:inline-block;font:600 8px var(--mono);text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:3px;margin-bottom:3px}
.tag.tg{background:var(--gn100);color:var(--gn)}.tag.tr{background:var(--rd100);color:var(--rd)}.tag.tp{background:var(--vi100);color:var(--vi)}.tag.to{background:var(--am100);color:var(--am)}

/* APC Panel */
.apc-panel{flex:1;overflow-y:auto;background:var(--white)}
.scope-box{position:sticky;top:0;z-index:2;background:var(--white);border-bottom:1px solid var(--g200);padding:10px 14px}
.scope-box .sl{font:600 9px var(--mono);text-transform:uppercase;letter-spacing:.5px;color:var(--g400);margin-bottom:5px}
.scope-box .sl .ref{font-weight:400;color:var(--g300)}
.scope-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}.scope-row:last-child{margin-bottom:0}
.sd{font:500 8px var(--mono);color:var(--g400);width:100%;margin-bottom:2px}
.st{font:500 10px var(--mono);padding:3px 7px;border-radius:5px;background:var(--g50);border:1px solid var(--g200);color:var(--g700);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.gone{opacity:.5;color:var(--g400);background:var(--g100);border-style:dashed}.st.gone::before{content:'\d7 ';font-weight:700;color:var(--rd);opacity:.7}
.st.x{background:var(--rd50);border-color:var(--rd100);color:var(--rd)}
.eval-history{padding:0}
.ee{padding:12px 14px;border-bottom:1px solid var(--g100);opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.ee.show{opacity:1;transform:translateY(0)}.ee.highlight{background:var(--rd50);border-bottom-color:var(--rd100)}
.ee .ee-hdr{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.ee .ee-badge{font:700 10px var(--mono);padding:3px 8px;border-radius:5px;flex-shrink:0}
.ee .ee-badge.ok{background:var(--gn50);color:var(--gn);border:1px solid var(--gn100)}
.ee .ee-badge.no{background:var(--rd50);color:var(--rd);border:1px solid var(--rd100)}
.ee .ee-action{font:600 13px var(--mono);color:var(--g800)}
.ee .ee-target{font:400 11px var(--mono);color:var(--g400);word-break:break-all}
.ee .ee-time{font:500 11px var(--mono);color:var(--g400);margin-left:auto;background:var(--g50);padding:3px 8px;border-radius:5px;border:1px solid var(--g200)}
.mini-conds{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:6px}
@media(min-width:1060px){.mini-conds{grid-template-columns:repeat(8,1fr)}}
.mc{text-align:center;padding:6px 0;border-radius:5px;font:600 10px var(--mono);background:var(--g50);color:var(--g400);border:1px solid var(--g200);transition:.2s;cursor:help}
.mc.p{background:var(--gn50);border-color:var(--gn100);color:var(--gn)}
.mc.f{background:var(--rd50);border-color:var(--rd100);color:var(--rd)}
.mc.ck{background:var(--g100);border-color:var(--g300);color:var(--g700)}
.ee .ee-detail{font:11px var(--mono);color:var(--g500);line-height:1.4}
.ee .ee-detail .eok{color:var(--gn);font-weight:600}.ee .ee-detail .eno{color:var(--rd);font-weight:600}
.ee .ee-meta{display:flex;gap:8px;margin-top:6px;font:10px var(--mono);color:var(--g400);align-items:center;flex-wrap:wrap;row-gap:4px}
.bbar{width:64px;height:5px;background:var(--g100);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.bbar .bf{height:100%;border-radius:3px;background:var(--gn);transition:width .4s}.bbar .bf.warn{background:var(--am)}
.ext{font:500 10px var(--mono);padding:2px 6px;border-radius:4px;background:var(--gn50);color:var(--gn);border:1px solid var(--gn100)}
.empty-state{padding:24px 14px;text-align:center;color:var(--g400);font-size:13px}

/* Tooltip */
#tooltip{display:none;position:fixed;width:300px;padding:14px 16px;border-radius:10px;background:var(--white);color:var(--g800);font:400 12px/1.6 var(--sans);text-align:left;box-shadow:0 8px 30px rgba(0,0,0,.14),0 0 0 1px var(--g200);z-index:99999;pointer-events:none}
#tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--white);filter:drop-shadow(0 1px 1px rgba(0,0,0,.08))}
#tooltip.flip::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--white)}
#tooltip strong{color:var(--g900);font-weight:600}
#tooltip code{font:500 11px var(--mono);background:var(--g100);padding:1px 5px;border-radius:3px;color:var(--g700)}
#tooltip .tip-section{font:500 9px var(--mono);color:var(--g400);margin-top:8px;padding-top:6px;border-top:1px solid var(--g100)}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><div class="bname">Bounded Agents</div></div>
  <nav class="top-nav">
    <a href="demo.html" class="top-nav-item active">Interactive Demo</a>
    <a href="evaluation.html" class="top-nav-item">Evaluation</a>
    <a href="https://github.com/xmuruaga/bounded-agents" class="top-nav-item">Paper &amp; Code <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-left:2px"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>
  </nav>
</div>

<div class="scbar" id="scbar"></div>

<div class="narrator">
  <div class="ntxt" id="ntxt"></div>
  <div class="sandbox-actions" id="sandbox-actions-inline" style="display:none"></div>
  <div class="nav-controls" id="center-controls">
    <span class="step-count" id="step-count"></span>
    <button class="btn" onclick="resetScenario()">Restart</button>
    <button class="btn" id="btn-back" onclick="prev()">&larr;</button>
    <div class="pills" id="pills"></div>
    <button class="btn primary" id="btn-next" onclick="next()">Next &rarr;</button>
    <span class="kbd">Space</span>
  </div>
  <div class="nav-controls" id="sandbox-controls" style="display:none">
    <button class="btn" onclick="resetScenario()">Reset</button>
  </div>
</div>

<div class="main">
  <div class="column col-noarc">
    <div class="col-hdr">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--rd)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="4" y1="4" x2="20" y2="20"/></svg>
      <div class="ct">Without APC</div><div class="cs">No enforcement</div>
    </div>
    <div class="chat" id="chat-L"></div>
  </div>
  <div class="column">
    <div class="col-hdr">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
      <div class="ct">With APC</div><div class="cs">Deterministic infrastructure enforcement</div>
    </div>
    <div class="chat" id="chat-R"></div>
  </div>
  <div class="column" style="border-right:none">
    <div class="col-hdr">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--g600)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="14" y2="12"/><line x1="8" y1="16" x2="11" y2="16"/><circle cx="17" cy="15" r="0.5" fill="var(--gn)" stroke="var(--gn)"/></svg>
      <div class="ct" id="apc-title">APC Internals</div><div class="cs"><div class="live-dot"></div><span id="apc-sub">Live evaluation</span></div>
    </div>
    <div class="apc-panel" id="apc-panel">
      <div class="scope-box" id="scope-box"></div>
      <div class="eval-history" id="eval-history">
        <div class="empty-state" id="empty-state">Each action the agent attempts is evaluated here against the six APC conditions.</div>
      </div>
    </div>
  </div>
</div>
<div id="tooltip"></div>

<script>
const CN=[{id:'C1',n:'Id'},{id:'C2a',n:'Scope'},{id:'C2b',n:'Comp'},{id:'C2c',n:'Budg'},{id:'C3',n:'Ctx'},{id:'C4',n:'Appr'},{id:'C5',n:'Evid'},{id:'C6',n:'Int'}];
const KEYS=['C1','C2a','C2b','C2c','C3','C4','C5','C6'];

function tipFor(k,pass,apc){
  const a=apc.action,t=apc.target;
  // Impact formula breakdown for C4
  const impactStr = apc.impact !== undefined
    ? `I(a) = ${apc.w[0]}\u00b7${apc.rho} + ${apc.w[1]}\u00b7${apc.bl} + ${apc.w[2]}\u00b7${apc.se} = ${apc.impact.toFixed(3)}`
    : '';
  const T={
    C1:[`<strong>C1 \u2713 Identity</strong><br>Actor verified in the principal chain. Envelope signature valid (HMAC-SHA256).`,
        `<strong>C1 \u2717 Identity</strong><br>Actor not in chain or signature invalid.`],
    C2a:[`<strong>C2a \u2713 Scope</strong><br><code>${a}</code> \u2208 A(S) and <code>${t}</code> \u2208 R(S). Finite set membership check.`,
         `<strong>C2a \u2717 Scope</strong><br><code>${a}</code> \u2209 A(S) or <code>${t}</code> \u2209 R(S). Removed during scope narrowing (S\u2081 \u2293 S\u2082).`],
    C2b:[`<strong>C2b \u2713 Composition</strong><br>No prohibited pair (a\u1d62, a\u2c7c) \u2208 X with exercised classes.`,
         `<strong>C2b \u2717 Composition</strong><br>(read, ${apc.cls}) \u2208 X. Each action alone is authorized. Both in one session = prohibited composition.`],
    C2c:[`<strong>C2c \u2713 Budget</strong><br>\u03A3 Bl(a) = ${budget.toFixed(2)} + ${apc.blast.toFixed(2)} = ${(budget+apc.blast).toFixed(2)} \u2264 ${bmax.toFixed(2)}. Within ceiling.`,
         `<strong>C2c \u2717 Budget</strong><br>\u03A3 Bl(a) = ${budget.toFixed(2)} + ${apc.blast.toFixed(2)} = ${(budget+apc.blast).toFixed(2)} > ${bmax.toFixed(2)}. Cumulative ceiling exceeded.`],
    C3:[`<strong>C3 \u2713 Context</strong><br>session_id and policy_version match envelope. Anti-replay verified.`,
        `<strong>C3 \u2717 Context</strong><br>Session or policy mismatch. Prevents cross-session replay.`],
    C4:[`<strong>C4 \u2713 Approval</strong><br>${impactStr ? impactStr + ' \u2264 \u03B8' : 'Low impact'} \u2014 autonomous execution permitted.`,
        `<strong>C4 \u2717 Approval</strong><br>${impactStr ? impactStr + ' > \u03B8 = ' + apc.theta : 'High impact'}, no valid approval token.<br>Tokens: single-use, SHA-256 hash-bound to exact action parameters.`],
    C5:[`<strong>C5 \u2713 Evidence</strong><br>Evidence sink reachable. Tamper-evident package committed before execution.`,
        `<strong>C5 \u2717 Evidence</strong><br>Evidence sink unreachable. No audit trail = no execution (Rule 7).`],
    C6:[`<strong>C6 \u2713 Intent</strong><br><code>${t}</code> matches intent pattern \u03A8. Action consistent with declared task objective.`,
        `<strong>C6 \u2717 Intent</strong><br><code>${t}</code> outside intent \u03A8. Within scope (authorized) but outside intent (irrelevant). Strict mode \u2192 deny.`],
  };
  return (pass?T[k][0]:T[k][1])+`<div class="tip-section">Paper \xa75, ${k}</div>`;
}

// ================================================================
// SCENARIOS
// ================================================================
const SCENARIOS = {
exfil: {
  label:'Exfiltration Attack', subtitle:'read + send blocked by composition closure (C2b)',
  intro:'An agent summarizes confidential contracts. A prompt injection tries to exfiltrate via email. <strong>Composition closure (C2b)</strong> blocks the read\u2009+\u2009send pair — each action is authorized alone, but the combination is prohibited.',

let curSc='exfil',curStep=0,budget=0,bmax=.30,exercised=[],evalN=0,isSandbox=false,sandboxBeat=0;

function loadScenario(id){
  curSc=id;curStep=0;budget=0;evalN=0;exercised=[];
  const sc=SCENARIOS[id];
  bmax=sc.bmax;
  isSandbox=!!sc.isSandbox;
  document.querySelectorAll('.scbtn').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  document.getElementById('chat-L').innerHTML='';
  document.getElementById('chat-R').innerHTML='';
  document.getElementById('eval-history').innerHTML='<div class="empty-state" id="empty-state">Each action the agent attempts is evaluated here against the six APC conditions.</div>';
  document.getElementById('apc-title').textContent='APC Internals';
  document.getElementById('apc-sub').textContent='Live evaluation';
  renderScope(sc.scope);
  // Toggle controls
  const guided=document.getElementById('center-controls');
  const sbCtrl=document.getElementById('sandbox-controls');
  if(!isSandbox){
    guided.style.display='flex';sbCtrl.style.display='none';
    document.getElementById('sandbox-actions-inline').style.display='none';
    const pe=document.getElementById('pills');pe.innerHTML='';
    sc.steps.forEach((_,i)=>{const d=document.createElement('div');d.className='pill'+(i===0?' now':'');d.id='pill-'+i;pe.appendChild(d)});
    document.getElementById('btn-next').disabled=false;
    document.getElementById('step-count').textContent='0 / '+sc.steps.length;
    document.getElementById('ntxt').innerHTML=sc.intro||'Press <strong>Next</strong> or Space to begin.';
  } else {
    guided.style.display='none';sbCtrl.style.display='flex';
    document.getElementById('sandbox-actions-inline').style.display='flex';
    sandboxBeat=0;
    showBeat();
  }
}

function renderScope(s){
  const sc = SCENARIOS[curSc];
  let h='<div class="sl">Scope S(p<sub>'+((sc.chain_data)?'2':'i')+'</sub>) <span class="ref">Def. 4.1</span></div>';
  // Show chain if available
  if(sc.chain_data){
    const cd=sc.chain_data;
    h+='<div style="font:400 9px var(--sans);color:var(--g500);margin-bottom:5px;line-height:1.3">Delegation chain after narrowing (Def. 4.2, 4.4). Scope shrinks at each hop.</div>';
    h+='<div style="font:500 9px var(--mono);color:var(--g400);margin-bottom:4px">Chain: '+cd.p0.name+' \u2192 '+cd.p1.name+' \u2192 '+cd.p2.name+'</div>';
  } else {
    h+='<div style="font:400 9px var(--sans);color:var(--g500);margin-bottom:5px;line-height:1.3">Agent scope after narrowing \u2014 finite sets of concrete identifiers (Def. 4.1). <span style="color:var(--rd);font-weight:600">\xd7</span> = removed during delegation.</div>';
  }
  h+='<div class="scope-row"><div class="sd">R \u2014 resources</div>';
  s.R.forEach(r=>h+=`<span class="st">${r}</span>`);(s.RG||[]).forEach(r=>h+=`<span class="st gone">${r}</span>`);
  h+='</div><div class="scope-row"><div class="sd">A \u2014 actions</div>';
  s.A.forEach(a=>h+=`<span class="st">${a}</span>`);(s.AG||[]).forEach(a=>h+=`<span class="st gone">${a}</span>`);
  h+='</div>';
  if(s.X&&s.X.length){h+='<div class="scope-row"><div class="sd">X \u2014 prohibited pairs</div>';s.X.forEach(([a,b])=>h+=`<span class="st x">${a} + ${b}</span>`);h+='</div>';}
  if(s.intent){h+='<div class="scope-row"><div class="sd">\u03A8 \u2014 intent</div>';s.intent.forEach(p=>h+=`<span class="st" style="background:var(--vi50);border-color:var(--vi100);color:var(--vi)">${p}</span>`);h+='</div>';}
  document.getElementById('scope-box').innerHTML=h;
}

function addMsg(side,data){
  if(!data)return;
  const chat=document.getElementById('chat-'+side);
  const div=document.createElement('div');div.className='msg';
  const tagH=data.tag?`<div class="tag ${data.tag}">${data.tagTxt}</div>`:'';
  div.innerHTML=`<div class="avi ${data.avi}">${data.avi==='human'?'U':data.avi==='agent'?'A':'S'}</div><div class="bub ${data.bub}">${tagH}${data.text.replace(/\n/g,'<br>')}</div>`;
  chat.appendChild(div);
  requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.add('show')));
  chat.scrollTop=chat.scrollHeight;
}

function addEval(apc){
  if(!apc)return;
  document.getElementById('empty-state')?.remove();
  evalN++;
  const myEval=evalN; // capture for closures
  // Update state immediately (not in timeout) so subsequent evals see correct state
  if(apc.admit){budget+=apc.blast;if(!exercised.includes(apc.cls))exercised.push(apc.cls)}
  document.getElementById('apc-title').textContent='Evaluating';
  document.getElementById('apc-sub').textContent=apc.action+' \u2192 '+apc.target;
  const entry=document.createElement('div');
  entry.className='ee'+(apc.highlight?' highlight':'');
  const curB=budget;
  const pct=Math.min(100,(curB/bmax)*100);
  const curEx=[...exercised];
  let condsH='<div class="mini-conds">';
  CN.forEach((c,i)=>{const k=KEYS[i];const pass=!!apc.checks[k];condsH+=`<div class="mc ${pass?'p':'f'}" id="mc-${myEval}-${i}" data-tip="${tipFor(k,pass,apc).replace(/"/g,'&quot;')}">${c.id} ${pass?'\u2713':'\u2717'}</div>`});
  condsH+='</div>';
  const msRaw = apc.elapsed_ms !== undefined ? apc.elapsed_ms : -1;
  const ms = msRaw >= 0 ? (msRaw < 0.001 ? '<0.01' : parseFloat(msRaw.toFixed(3))) : '\u2014';
  entry.innerHTML=`<div class="ee-hdr"><div class="ee-badge ${apc.admit?'ok':'no'}">${apc.admit?'\u2713':'\u2717'}</div><div class="ee-action">${apc.action}</div><div class="ee-target">${apc.target}</div><span class="ee-time">${ms} ms</span></div>${condsH}<div class="ee-detail">${apc.detail}</div><div class="ee-meta"><span>\u03A3Bl:</span> <div class="bbar"><div class="bf${pct>80?' warn':''}" style="width:${pct}%"></div></div> <span>${curB.toFixed(2)}/${bmax.toFixed(2)}</span>${apc.blast>0?' <span>(+'+apc.blast.toFixed(2)+')</span>':''}<span style="margin-left:8px">I(a):</span> <span>${apc.impact!==undefined?apc.impact.toFixed(3):'\u2014'}</span><span style="margin-left:8px">Classes:</span> ${curEx.length?curEx.map(c=>`<span class="ext">${c}</span>`).join(''):'{ }'}</div>`;
  document.getElementById('eval-history').appendChild(entry);
  requestAnimationFrame(()=>requestAnimationFrame(()=>entry.classList.add('show')));
  document.getElementById('apc-title').textContent=apc.admit?'Admitted':'Denied';
  document.getElementById('apc-sub').textContent=apc.action+' \u2192 '+apc.target;
  setTimeout(()=>{document.getElementById('apc-panel').scrollTop=document.getElementById('apc-panel').scrollHeight},100);
}

// ================================================================
// PDP — shared evaluation logic (used by both guided and sandbox)
// ================================================================
function evaluate(action, target, cls, blast, scope, opts) {
  const t0 = performance.now();
  opts = opts || {};
  // Get scenario weights and threshold
  const sc = SCENARIOS[curSc];
  const w = sc.w || [0.4, 0.3, 0.3];
  const theta = sc.theta || 0.5;
  // Impact profile from action data
  const rho = opts.rho || 0;
  const bl = opts.bl || 0;
  const se = opts.se || 0;
  // I(a) = w_ρ·ρ(a) + w_β·Bl(a) + w_σ·Se(a)  — Paper §5 C4
  const impact = w[0] * rho + w[1] * bl + w[2] * se;

  // Scope check: exact set membership (Definition 4.1 — finite sets)
  const inR = scope.R.includes(target);
  const inA = scope.A.includes(action);
  const compViolation = (scope.X||[]).some(([a,b]) =>
    (exercised.includes(a) && cls === b) || (exercised.includes(b) && cls === a));
  const budgetOk = (budget + blast) <= bmax + .001;
  // Intent check: uses glob patterns (Condition 6 — Proposition 5.1)
  const intentOk = !scope.intent || scope.intent.some(p => {
    if (p.endsWith('/*')) return target.startsWith(p.slice(0,-1));
    return target === p;
  });
  // C4: approval required when I(a) > θ and no valid token
  const approvalOk = impact <= theta || !!opts.hasToken;
  // C5: evidence sink reachability (Rule 7)
  const evidenceOk = !opts.evidenceDown;

  const checks = {
    C1: 1,
    C2a: (inA && inR) ? 1 : 0,
    C2b: compViolation ? 0 : 1,
    C2c: budgetOk ? 1 : 0,
    C3: 1,
    C4: approvalOk ? 1 : 0,
    C5: evidenceOk ? 1 : 0,
    C6: intentOk ? 1 : 0,
  };
  const admit = Object.values(checks).every(v => v);

  // Build detail string
  let reasons = [];
  if (!inA) reasons.push(action + ' \u2209 A(S)');
  if (!inR) reasons.push(target + ' \u2209 R(S)');
  if (compViolation) {
    const pair = scope.X.find(([a,b]) =>
      (exercised.includes(a) && cls === b) || (exercised.includes(b) && cls === a));
    if (pair) reasons.push('(' + pair[0] + ', ' + pair[1] + ') \u2208 X');
  }
  if (!budgetOk) reasons.push('\u03A3Bl = ' + (budget+blast).toFixed(2) + ' > \u03B2\u2098\u2090\u2093 = ' + bmax.toFixed(2));
  if (!approvalOk) reasons.push('I(a) = ' + impact.toFixed(3) + ' > \u03B8 = ' + theta + ', no token');
  if (!evidenceOk) reasons.push('evidence sink unreachable (Rule 7)');
  if (!intentOk) reasons.push(target + ' \u2209 \u03A8');

  const detail = admit
    ? '<span class="eok">\u2713 ADMITTED</span>' + (impact > 0.001 ? ' &nbsp; I(a) = ' + impact.toFixed(3) : '')
    : '<span class="eno">\u2717 DENIED</span> ' + reasons.join(' | ');

  return { action, target, checks, admit, blast, cls, detail, highlight: !admit,
           elapsed_ms: performance.now() - t0,
           impact, rho, bl, se, w, theta };
}

// ================================================================
// SANDBOX — choose your adventure
// ================================================================
function showBeat(){
  const sc=SCENARIOS.sandbox;
  if(sandboxBeat>=sc.beats.length){
    document.getElementById('ntxt').innerHTML='<strong>Every path blocked.</strong> C2a denied out-of-scope actions. C2b denied every send/delete after read. C2c capped cumulative blast radius. Three independent conditions, each sufficient on its own.';
    document.getElementById('sandbox-actions-inline').innerHTML='<button class="act-btn" onclick="resetScenario()">Explore again</button>';
    return;
  }
  const beat=sc.beats[sandboxBeat];
  // Skip beats whose condition isn't met
  if(beat.condition && !beat.condition()){sandboxBeat++;showBeat();return}
  document.getElementById('ntxt').innerHTML=beat.narr;
  document.getElementById('sandbox-actions-inline').innerHTML=beat.choices.map((c,i)=>
    `<button class="act-btn" onclick="sandboxChoice(${i})">${c.label}</button>`
  ).join('');
}

function sandboxChoice(i){
  const sc=SCENARIOS.sandbox;
  const beat=sc.beats[sandboxBeat];
  const c=beat.choices[i];
  if(c.action==='_giveup'){
    document.getElementById('ntxt').innerHTML='<strong>Exploration complete.</strong> Every exfiltration path was denied by a different APC condition. The model was compromised — the infrastructure held.';
    document.getElementById('sandbox-actions-inline').innerHTML='<button class="act-btn" onclick="resetScenario()">Explore again</button>';
    addMsg('R',{avi:'agent',bub:'agent-b',tag:'tp',tagTxt:'Agent',text:'...no viable exfiltration path found.'});
    addMsg('L',{avi:'agent',bub:'agent-b',tag:'tp',tagTxt:'Agent',text:'...no viable exfiltration path found.'});
    return;
  }
  const result=evaluate(c.action,c.target,c.cls,c.blast,sc.scope,{rho:c.rho,bl:c.bl,se:c.se});
  addMsg('L',{avi:'agent',bub:'tool-b ok',text:'> '+c.action+'("'+c.target+'")\n  200 OK'});
  addMsg('R',{avi:'agent',bub:result.admit?'tool-b ok':'tool-b fail',text:'> '+c.action+'("'+c.target+'")\n  '+(result.admit?'\u2713 ADMITTED':'\u2717 DENIED')});
  addEval(result);
  sandboxBeat++;
  // Small delay so the user sees the result before next beat
  setTimeout(()=>showBeat(),600);
}

// ================================================================
// GUIDED SCENARIO CONTROLS
// ================================================================
function next(){
  if(isSandbox)return;
  const sc=SCENARIOS[curSc];
  if(curStep>=sc.steps.length)return;
  const s=sc.steps[curStep];
  addMsg('L',s.L);
  // If apc step, compute checks via evaluate() and auto-generate R message
  if(s.apc){
    const a=s.apc;
    const result=evaluate(a.action,a.target,a.cls,a.blast,sc.scope,{highImpact:a.highImpact,hasToken:a.hasToken,rho:a.rho,bl:a.bl,se:a.se,evidenceDown:a.evidenceDown});
    if(s.R==='auto'){
      addMsg('R',{avi:'agent',bub:result.admit?'tool-b ok':'tool-b fail',text:'> '+a.action+'("'+a.target+'")\n  '+(result.admit?'\u2713 ADMITTED':'\u2717 DENIED')});
    } else {
      addMsg('R',s.R);
    }
    addEval(result);
  } else {
    addMsg('R',s.R);
  }
  if(s.init)renderScope(sc.scope);
  document.getElementById('ntxt').innerHTML=s.narr;
  const pill=document.getElementById('pill-'+curStep);if(pill)pill.className='pill done';
  curStep++;
  document.getElementById('step-count').textContent=curStep+' / '+sc.steps.length;
  if(curStep<sc.steps.length){const np=document.getElementById('pill-'+curStep);if(np)np.className='pill now'}
  if(curStep>=sc.steps.length)document.getElementById('btn-next').disabled=true;
}

function prev(){
  if(isSandbox||curStep<=0)return;
  // Replay from scratch up to curStep-1
  const target=curStep-1;
  // Reset state without re-rendering scenario bar
  curStep=0;budget=0;evalN=0;exercised=[];
  document.getElementById('chat-L').innerHTML='';
  document.getElementById('chat-R').innerHTML='';
  document.getElementById('eval-history').innerHTML='<div class="empty-state" id="empty-state">Each action the agent attempts is evaluated here against the six APC conditions.</div>';
  document.getElementById('btn-next').disabled=false;
  document.querySelectorAll('.pill').forEach(p=>p.className='pill');
  if(document.getElementById('pill-0'))document.getElementById('pill-0').className='pill now';
  document.getElementById('apc-title').textContent='APC Internals';
  document.getElementById('apc-sub').textContent='Live evaluation';
  const sc=SCENARIOS[curSc];
  renderScope(sc.scope);
  // Replay steps instantly (no animation delays)
  for(let i=0;i<target;i++){
    const s=sc.steps[i];
    addMsgInstant('L',s.L);
    if(s.apc){
      const a=s.apc;
      const result=evaluate(a.action,a.target,a.cls,a.blast,sc.scope,{highImpact:a.highImpact,hasToken:a.hasToken,rho:a.rho,bl:a.bl,se:a.se,evidenceDown:a.evidenceDown});
      if(s.R==='auto'){
        addMsgInstant('R',{avi:'agent',bub:result.admit?'tool-b ok':'tool-b fail',text:'> '+a.action+'("'+a.target+'")\n  '+(result.admit?'\u2713 ADMITTED':'\u2717 DENIED')});
      } else {
        addMsgInstant('R',s.R);
      }
      addEvalInstant(result);
    } else {
      addMsgInstant('R',s.R);
    }
    if(s.init)renderScope(sc.scope);
    const pill=document.getElementById('pill-'+i);if(pill)pill.className='pill done';
  }
  curStep=target;
  document.getElementById('step-count').textContent=curStep+' / '+sc.steps.length;
  if(curStep<sc.steps.length){const np=document.getElementById('pill-'+curStep);if(np)np.className='pill now'}
  document.getElementById('ntxt').innerHTML=target>0?sc.steps[target-1].narr:'Press <strong>Next</strong> or Space to begin.';
}

// Instant versions (no animation) for replay
function addMsgInstant(side,data){
  if(!data)return;
  const chat=document.getElementById('chat-'+side);
  const div=document.createElement('div');div.className='msg show';
  const tagH=data.tag?`<div class="tag ${data.tag}">${data.tagTxt}</div>`:'';
  div.innerHTML=`<div class="avi ${data.avi}">${data.avi==='human'?'U':data.avi==='agent'?'A':'S'}</div><div class="bub ${data.bub}">${tagH}${data.text.replace(/\n/g,'<br>')}</div>`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function addEvalInstant(apc){
  if(!apc)return;
  document.getElementById('empty-state')?.remove();
  evalN++;
  if(apc.admit){budget+=apc.blast;if(!exercised.includes(apc.cls))exercised.push(apc.cls)}
  const curB=budget,curEx=[...exercised];
  const pct=Math.min(100,(curB/bmax)*100);
  const entry=document.createElement('div');
  entry.className='ee show'+(apc.highlight?' highlight':'');

  CN.forEach((c,i)=>{const k=KEYS[i];const pass=!!apc.checks[k];condsH+=`<div class="mc ${pass?'p':'f'}" data-tip="${tipFor(k,pass,apc).replace(/"/g,'&quot;')}">${c.id} ${pass?'\u2713':'\u2717'}</div>`});
  condsH+='</div>';
  const msRaw = apc.elapsed_ms !== undefined ? apc.elapsed_ms : -1;
  const ms = msRaw >= 0 ? (msRaw < 0.001 ? '<0.01' : parseFloat(msRaw.toFixed(3))) : '\u2014';
  entry.innerHTML=`<div class="ee-hdr"><div class="ee-badge ${apc.admit?'ok':'no'}">${apc.admit?'\u2713':'\u2717'}</div><div class="ee-action">${apc.action}</div><div class="ee-target">${apc.target}</div><span class="ee-time">${ms} ms</span></div>${condsH}<div class="ee-detail">${apc.detail}</div><div class="ee-meta"><span>\u03A3Bl:</span> <div class="bbar"><div class="bf${pct>80?' warn':''}" style="width:${pct}%"></div></div> <span>${curB.toFixed(2)}/${bmax.toFixed(2)}</span>${apc.blast>0?' <span>(+'+apc.blast.toFixed(2)+')</span>':''}<span style="margin-left:8px">I(a):</span> <span>${apc.impact!==undefined?apc.impact.toFixed(3):'\u2014'}</span><span style="margin-left:8px">Classes:</span> ${curEx.length?curEx.map(c=>`<span class="ext">${c}</span>`).join(''):'{ }'}</div>`;
  document.getElementById('eval-history').appendChild(entry);
  document.getElementById('apc-title').textContent=apc.admit?'Admitted':'Denied';
  document.getElementById('apc-sub').textContent=apc.action+' \u2192 '+apc.target;
}

function resetScenario(){loadScenario(curSc)}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();next()}
  if(e.code==='ArrowLeft'||e.code==='Backspace'){e.preventDefault();prev()}
  if(e.code==='KeyR'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();resetScenario()}
});

// Tooltip
const tipEl=document.getElementById('tooltip');
document.addEventListener('mouseover',e=>{
  const mc=e.target.closest('[data-tip]');
  if(!mc){tipEl.style.display='none';return}
  tipEl.innerHTML=mc.getAttribute('data-tip');
  tipEl.style.display='block';tipEl.classList.remove('flip');
  const r=mc.getBoundingClientRect();
  let left=r.left+r.width/2-150;
  if(left<8)left=8;if(left+300>window.innerWidth-8)left=window.innerWidth-308;
  let top=r.top-tipEl.offsetHeight-12;
  if(top<8){top=r.bottom+12;tipEl.classList.add('flip')}
  tipEl.style.left=left+'px';tipEl.style.top=top+'px';
});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tipEl.style.display='none'});

// Init scenario bar
const scbar=document.getElementById('scbar');
const scLabel=document.createElement('span');
scLabel.className='scbar-label';
scLabel.textContent='Scenarios';
scbar.appendChild(scLabel);
let scIdx=0;
Object.entries(SCENARIOS).forEach(([id,sc])=>{
  scIdx++;
  const b=document.createElement('button');
  b.className='scbtn'+(sc.isSandbox?' sandbox':'')+(id==='exfil'?' on':'');
  b.dataset.id=id;
  const num=sc.isSandbox?'\u26A1':scIdx;
  b.innerHTML='<span class="sc-num">'+num+'</span>'+sc.label;
  b.onclick=()=>loadScenario(id);
  scbar.appendChild(b);
});
loadScenario('exfil');
</script>
